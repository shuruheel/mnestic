[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "mnestic"
version = "0.16.0"
description = "Embedded graph + vector + full-text database with Datalog — a maintained fork of CozoDB, tuned as a substrate for agentic memory."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MPL-2.0" }
authors = [{ name = "Shan Rizvi" }]
keywords = ["database", "graph", "vector", "datalog", "embeddings", "rag", "agentic-memory", "cozodb"]
classifiers = [
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
]

[project.urls]
Homepage = "https://github.com/shuruheel/mnestic"
Repository = "https://github.com/shuruheel/mnestic"

[tool.maturin]
# The importable module is the cdylib `[lib] name` ("mnestic"). `compact` pulls
# storage-sqlite + graph-algo (the latter brings rayon, which the engine
# requires) + requests. `rdf-io` ships the RdfReader/export surface AND (via
# the engine's implied `data-import` gate) CsvReader/JsonReader — a signed
# posture decision (rdf-boundary-io spec §12 Q6).
#
# This pin governs SDIST builds only: released wheels are built by
# .github/workflows/python-publish.yml with `--no-default-features
# --features compact,storage-rocksdb,rdf-io,columnar-io` on the maturin CLI. The sdist
# ships no rocksdb sources (the cozorocks/rocksdb submodule isn't packed), so
# the persist ("rocksdb") engine is WHEEL-ONLY — keep this at
# `compact,rdf-io,columnar-io` (no RocksDB sources required) or sdist installs
# break. `columnar-io` may compile native Zstandard support, so CI's platform
# build matrix is authoritative. (abi3 wheels —
# one per platform, not per-Python — come from pyo3's abi3-py37 feature in
# Cargo.toml, not from any feature choice here.)
no-default-features = true
features = ["compact", "rdf-io", "columnar-io"]
